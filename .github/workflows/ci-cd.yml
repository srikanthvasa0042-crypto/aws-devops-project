name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t devops-app:${{ github.sha }} ./app

      # 5. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag devops-app:${{ github.sha }} \
            170727075529.dkr.ecr.us-east-1.amazonaws.com/devops-app:${{ github.sha }}

      # 6. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            170727075529.dkr.ecr.us-east-1.amazonaws.com/devops-app:${{ github.sha }}

      # 7. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name devops-eks-cluster

      # 8. Deploy to EKS
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/devops-app \
            devops-app=170727075529.dkr.ecr.us-east-1.amazonaws.com/devops-app:${{ github.sha }}

      # 9. Wait for rollout
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/devops-app